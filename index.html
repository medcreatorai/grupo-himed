<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grupo exclusivo · himed</title>
  <meta name="description" content="Entre para o grupo exclusivo da himed e receba em primeira mão a oferta de pré-lançamento da plataforma.">
  <meta name="theme-color" content="#1471E6">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="himed">
  <meta property="og:title" content="Grupo exclusivo da himed">
  <meta property="og:description" content="A oferta de pré-lançamento da plataforma chega primeiro no grupo.">
  <link rel="canonical" href="https://medcreatorai.github.io/grupo-himed/">
  <meta property="og:url" content="https://medcreatorai.github.io/grupo-himed/">
  <meta property="og:image" content="https://medcreatorai.github.io/grupo-himed/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #1471E6;
      --preto: #000000;
      --branco: #FFFFFF;
      --ciano: #A6FFF8;
      --branco-apoio: rgba(255, 255, 255, 0.78);
      --branco-fino: rgba(255, 255, 255, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--azul); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--azul);
      color: var(--branco);
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding:
        max(28px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .pagina {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo { display: block; width: 132px; height: auto; }

    .conteudo {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 0 40px;
    }

    .selo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      padding: 7px 14px 7px 12px;
      border: 1px solid var(--branco-fino);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .ponto {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ciano);
      animation: gravando 1.6s ease-in-out infinite;
    }

    @keyframes gravando {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-weight: 800;
      font-size: clamp(28px, 8.8vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.01em;
    }

    h1 .linha { display: block; }

    h1 .tarja {
      display: inline-block;
      background: var(--ciano);
      color: var(--preto);
      padding: 0.02em 0.22em 0.04em;
      margin: 0.1em 0 0.1em -0.22em;
    }

    .texto {
      margin-top: 24px;
      font-size: 18px;
      line-height: 1.55;
      max-width: 30ch;
    }

    .apoio {
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--branco-apoio);
      max-width: 32ch;
    }

    .cta {
      margin-top: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      padding: 16px 24px;
      background: var(--branco);
      color: var(--preto);
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover { background: var(--ciano); }
    .cta:active { transform: scale(0.98); }
    .cta:focus-visible { outline: 3px solid var(--ciano); outline-offset: 3px; }

    .cta svg { width: 24px; height: 24px; flex: none; }

    .nota {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--branco-apoio);
    }

    .rodape {
      border-top: 1px solid var(--branco-fino);
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--branco-apoio);
    }

    .rodape a { color: var(--branco); text-decoration: none; }
    .rodape a:hover { text-decoration: underline; }

    @media (min-width: 720px) {
      .logo { width: 150px; }
      .conteudo { padding: 64px 0 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ponto { animation: none; }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header>
      <img class="logo" src="assets/himed-logo-branco.png" width="720" height="199" alt="himed">
    </header>

    <main class="conteudo">
      <span class="selo"><span class="ponto" aria-hidden="true"></span>Pré-lançamento</span>

      <h1>
        <span class="linha">ENTRE PARA O</span>
        <span class="linha"><span class="tarja">GRUPO EXCLUSIVO</span></span>
        <span class="linha">DA himed</span>
      </h1>

      <p class="texto">No grupo, você recebe em primeira mão a oferta de pré-lançamento da plataforma.</p>
      <p class="apoio">Como ela vai funcionar, a gente conta lá dentro.</p>

    </main>

    <footer class="rodape">
      <span>Feito por médico, para médico creator.</span>
      <a href="https://www.instagram.com/himed_ai/" rel="noopener">@himed_ai</a>
    </footer>
  </div>
</body>
</html>
